name: Build and publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Anaconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: true
          miniconda-version: latest
          python-version: "3.13"
          environment-file: environment.yml
          activate-environment: py_for_ds
      - name: Restore execution cache
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('lectures/**', 'environment.yml') }}
          restore-keys: jupyter-cache-
      - name: Build download notebooks
        shell: bash -l {0}
        run: jb build lectures --path-output ./ --builder=custom --custom-builder=jupyter
      - name: Copy download notebooks into the site
        shell: bash -l {0}
        run: |
          mkdir -p _build/html/_notebooks
          cp -u _build/jupyter/*.ipynb _build/html/_notebooks
      - name: Build HTML
        shell: bash -l {0}
        run: |
          rm -rf _build/.doctrees
          jb build lectures --path-output ./
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
