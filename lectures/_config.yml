title: Python for Data Science
author: John Stachurski
logo: _static/qe-logo.png
description: Lecture notes for Python for Data Science (DSC1030E / DSC6031E) at the National Graduate Institute for Policy Studies.

parse:
  myst_enable_extensions:  # default extensions to enable in the myst parser. See https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

only_build_toc_files: true
execute:
  execute_notebooks: "cache"
  timeout: 600 # 10 minutes
  exclude_patterns:
    - '_static/*'

html:
  baseurl: https://jstac.github.io/py_for_ds_public/

bibtex_bibfiles:
  - _static/references.bib

sphinx:
  extra_extensions: [sphinx_multitoc_numbering, sphinx_exercise, sphinx_togglebutton, sphinx.ext.intersphinx, sphinx_proof, sphinx_tojupyter] 
  config:
    bibtex_reference_style: author_year
    # myst-nb config
    nb_render_image_options:
      width: 80%
    nb_code_prompt_show: "Show {type}"
    nb_merge_streams: true
    nb_mime_priority_overrides: [
       # HTML
       ['html', 'application/vnd.jupyter.widget-view+json', 10],
       ['html', 'application/javascript', 20],
       ['html', 'text/html', 30],
       ['html', 'text/latex', 40],
       ['html', 'image/svg+xml', 50],
       ['html', 'image/png', 60],
       ['html', 'image/jpeg', 70],
       ['html', 'text/markdown', 80],
       ['html', 'text/plain', 90],
       # Jupyter Notebooks
       ['jupyter', 'application/vnd.jupyter.widget-view+json', 10],
       ['jupyter', 'application/javascript', 20],
       ['jupyter', 'text/html', 30],
       ['jupyter', 'text/latex', 40],
       ['jupyter', 'image/svg+xml', 50],
       ['jupyter', 'image/png', 60],
       ['jupyter', 'image/jpeg', 70],
       ['jupyter', 'text/markdown', 80],
       ['jupyter', 'text/plain', 90],
       # LaTeX
       ['latex', 'text/latex', 10],
       ['latex', 'application/pdf', 20],
       ['latex', 'image/png', 30],
       ['latex', 'image/jpeg', 40],
       ['latex', 'text/markdown', 50],
       ['latex', 'text/plain', 60],
       # Link Checker
       ['linkcheck', 'text/plain', 10],
     ]
    suppress_warnings: [mystnb.unknown_mime_type, myst.domains]
    # sphinx-proof
    proof_minimal_theme: true
    # sphinx-exercise
    exercise_style: "solution_follow_exercise"
    # -------------
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    html_theme: quantecon_book_theme
    html_favicon: _static/lectures-favicon.ico
    html_static_path: ['_static']
    html_theme_options:
      authors:
        - name: John Stachurski
          url: https://johnstachurski.net/
      dark_logo: quantecon-logo-transparent.png
      header_organisation_url: https://quantecon.org
      header_organisation: QuantEcon
      repository_url: https://github.com/jstac/py_for_ds_public
      path_to_docs: lectures
      download_nb_path: https://jstac.github.io/py_for_ds_public
      description: Lecture notes for Python for Data Science at the National Graduate Institute for Policy Studies.
      keywords: Python, data science, policy, statistics
    intersphinx_mapping:
      intermediate: 
        - https://python.quantecon.org/
        - null
      pyprog:
        - https://python-programming.quantecon.org/
        - null
      intro: 
        - https://intro.quantecon.org/
        - null
      dle:
        - https://dle.quantecon.org/
        - null
      dps:
        - https://dps.quantecon.org/
        - null
      eqm:
        - https://eqm.quantecon.org/
        - null
      stats:
        - https://stats.quantecon.org/
        - null
      tools:
        - https://tools-techniques.quantecon.org/
        - null
      dynam:
        - https://dynamics.quantecon.org/
        - null
    mathjax3_config:
      tex:
        macros:
          "argmax" : "arg\\,max"
          "argmin" : "arg\\,min"
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    tojupyter_static_file_path: ["_static"]
    tojupyter_target_html: true
    tojupyter_urlpath: "https://jstac.github.io/py_for_ds_public/"
    tojupyter_image_urlpath: "https://jstac.github.io/py_for_ds_public/_static/"
    tojupyter_lang_synonyms: ["ipython", "ipython3", "python"]
    tojupyter_kernels:
      python3:
        kernelspec:
          display_name: "Python"
          language: python3
          name: python3
        file_extension: ".py"
    tojupyter_images_markdown: true